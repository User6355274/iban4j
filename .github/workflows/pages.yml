# Собирает веб-версию (web/) и публикует её на GitHub Pages.
# Один раз включите: Settings -> Pages -> Source: "GitHub Actions".
name: Сайт (GitHub Pages)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Собрать сайт (Java -> JavaScript через TeaVM)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -f web/pom.xml package
          ls -la web/target/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
